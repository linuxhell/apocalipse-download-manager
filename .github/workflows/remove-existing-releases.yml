# One-time maintenance authorized by the repository owner in chat.
# Deletes release objects/assets only. NEVER deletes Git tags or source history.
name: Remove existing releases (owner requested)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-existing-releases.yml']

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  remove-releases:
    if: github.repository == 'linuxhell/apocalipse-download-manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Disable release workflow and remove releases without touching tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GH_REPO/actions/workflows/release.yml/disable"
          gh api --paginate "repos/$GH_REPO/actions/workflows/release.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.status != "completed") | .id' > old-release-runs.txt
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
          done < old-release-runs.txt
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[] | [.ref,.object.sha] | @tsv' | sort > tags-before.txt
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.id,.tag_name,(.assets | length)] | @tsv' > releases-before.tsv
          cat releases-before.tsv
          while IFS=$'\t' read -r release_id tag asset_count; do
            [ -z "$release_id" ] && continue
            case "$release_id" in *[!0-9]*) echo 'Invalid release id'; exit 1;; esac
            echo "Removing release id=$release_id tag=$tag assets=$asset_count"
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done < releases-before.tsv
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].id' > releases-after.txt
          if [ -s releases-after.txt ]; then echo 'Releases still exist'; exit 1; fi
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[] | [.ref,.object.sha] | @tsv' | sort > tags-after.txt
          diff -u tags-before.txt tags-after.txt
          echo "Removed $(wc -l < releases-before.tsv) releases; preserved $(wc -l < tags-after.txt) tags."
          {
            echo '## Owner-requested release cleanup'
            echo "Removed $(wc -l < releases-before.tsv) releases and their assets."
            echo "Verified zero releases remain and $(wc -l < tags-after.txt) tags are unchanged."
            echo 'Source history and test artifacts were not deleted. Release publication is disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
