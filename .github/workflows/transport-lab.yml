name: Experimental transport lab
on:
  pull_request:
    paths: ['experiments/transport-lab/**', '.github/workflows/transport-lab.yml']
  push:
    branches: [main, codex/transport-macos-validation]
    paths: ['experiments/transport-lab/**', '.github/workflows/transport-lab.yml']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/transport-lab -> target
      - name: Assign the secondary macOS loopback source
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Format
        run: cargo fmt --manifest-path experiments/transport-lab/Cargo.toml --check
      - name: Test transport prototypes
        run: cargo test --locked --manifest-path experiments/transport-lab/Cargo.toml --all-features
      - name: Lint
        run: cargo clippy --locked --manifest-path experiments/transport-lab/Cargo.toml --all-features --all-targets -- -D warnings
      - name: Build experimental executable
        run: cargo build --locked --release --manifest-path experiments/transport-lab/Cargo.toml --all-features
      - uses: actions/upload-artifact@v4
        with:
          name: apocalipse-transport-lab-${{ matrix.os }}
          path: |
            experiments/transport-lab/target/release/apocalipse-transport-lab
            experiments/transport-lab/target/release/apocalipse-transport-lab.exe
            experiments/transport-lab/README.md
          if-no-files-found: error
          retention-days: 14
