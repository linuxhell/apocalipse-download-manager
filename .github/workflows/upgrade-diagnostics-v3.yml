name: Upgrade diagnostics v3 metadata and export
on:
  push:
    branches:
      - fix/rapidgator-preclick-0.3.29
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rapidgator-preclick-0.3.29
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Apply patch
        run: python scripts/upgrade_diagnostics_v3.py
      - name: Check and format
        run: |
          cargo check --workspace
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit patch
        run: |
          rm .github/workflows/upgrade-diagnostics-v3.yml
          rm scripts/upgrade_diagnostics_v3.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: enrich diagnostics metadata and export zip"
          git push
