name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      distribution_checks:
        description: 'Also compile on Debian, Fedora and Arch'
        type: boolean
        default: false
  workflow_call:
    inputs:
      distribution_checks:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 portable
            os: windows-latest
            artifact: apocalipse-download-manager-windows-x64-portable
            output: apocalipse-download-manager-windows-x64-portable.zip
            xtreme_binary: nibiru-xtreme.exe
          - name: Linux x64 portable
            os: ubuntu-22.04
            artifact: apocalipse-download-manager-linux-x64-portable
            output: apocalipse-download-manager-linux-x64-portable.tar.gz
            xtreme_binary: nibiru-xtreme
          - name: macOS x64 portable
            os: macos-15-intel
            artifact: apocalipse-download-manager-macos-x64-portable
            output: apocalipse-download-manager-macos-x64-portable.zip
            xtreme_binary: nibiru-xtreme

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for packaging checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpam0g-dev patchelf ffmpeg

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            experiments/transport-lab -> target
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      - name: Assign secondary macOS loopback source for transport tests
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Validate
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo fmt --manifest-path experiments/transport-lab/Cargo.toml -- --check
          cargo test --locked --manifest-path experiments/transport-lab/Cargo.toml --all-features

      - name: Verify prepared media with FFmpeg and FFprobe
        if: runner.os == 'Linux'
        run: |
          cargo test -p apocalipse-desktop --locked paired_preview_uses_real_mux_and_probe -- --ignored
          cargo test -p apocalipse-desktop --locked direct_audio_conversion_produces_requested_format_and_preserves_existing_files -- --ignored
      - name: Build desktop
        run: cargo build --release --locked -p apocalipse-desktop

      - name: Verify routing in release executable
        shell: bash
        run: |
          binary="target/release/apocalipse-desktop"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          "$binary" --verify-media-routing "$RUNNER_TEMP/media-routing.json"
          python3 - "$RUNNER_TEMP/media-routing.json" <<'PYVERIFY'
          import json, sys, tomllib
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["verified"] is True, report
          with open("Cargo.toml", "rb") as stream:
              version = tomllib.load(stream)["workspace"]["package"]["version"]
          assert report["version"] == version, report
          assert report["engine"] == "yt_dlp", report
          print(json.dumps(report))
          PYVERIFY

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd apps/desktop
          npx --yes @tauri-apps/cli@2 build --bundles appimage

      - name: Build xtreme backend from the pinned source
        shell: bash
        env:
          XTREME_BINARY: ${{ matrix.xtreme_binary }}
          # Xtreme keeps this in its own .cargo/config.toml, which "cargo install --git" does not read.
          RUSTFLAGS: --cfg reqwest_unstable
          CARGO_TARGET_DIR: target/xtreme-backend
        run: |
          set -euo pipefail
          # The backend is built from the same revision the desktop app links against, so a test
          # build never depends on a published release and always carries the same engine.
          rev="$(sed -n 's|^source = "git+https://github.com/linuxhell/nibiru-xtreme?rev=\([0-9a-f]*\)#.*|\1|p' Cargo.lock | head -n 1)"
          test -n "$rev"
          echo "nibiru-xtreme rev: $rev"
          cargo install --git https://github.com/linuxhell/nibiru-xtreme --rev "$rev" \
            --locked --root "$RUNNER_TEMP/xtreme-install" nibiru-xtreme
          mkdir -p dist/xtreme-backend
          cp "$RUNNER_TEMP/xtreme-install/bin/$XTREME_BINARY" "dist/xtreme-backend/$XTREME_BINARY"
          chmod 755 "dist/xtreme-backend/$XTREME_BINARY"
          "dist/xtreme-backend/$XTREME_BINARY" --version

      - name: Stage Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/Apocalipse Download Manager"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "target/release/apocalipse-desktop.exe" "$package/Apocalipse Download Manager.exe"
          New-Item -ItemType Directory -Force "$package/data/tools/nibiru-xtreme" | Out-Null
          Copy-Item "dist/xtreme-backend/nibiru-xtreme.exe" "$package/data/tools/nibiru-xtreme/nibiru-xtreme.exe"
          Copy-Item "README.md","README.en.md","README.zh-CN.md","LICENSE" $package
          Copy-Item "$env:RUNNER_TEMP/media-routing.json" "$package/build-verification.json"
          Compress-Archive -Path $package -DestinationPath "dist/${{ matrix.output }}" -Force

      - name: Stage Linux portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="dist/Apocalipse Download Manager"
          mkdir -p "$package/data/tools/nibiru-xtreme"
          install -m 755 target/release/apocalipse-desktop "$package/apocalipse-download-manager"
          install -m 755 dist/xtreme-backend/nibiru-xtreme "$package/data/tools/nibiru-xtreme/nibiru-xtreme"
          cp README.md README.en.md README.zh-CN.md LICENSE "$package/"
          cp "$RUNNER_TEMP/media-routing.json" "$package/build-verification.json"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          install -m 755 "$appimage" "dist/apocalipse-download-manager-linux-x64.AppImage"
          tar -C dist -czf "dist/${{ matrix.output }}" "Apocalipse Download Manager"

      - name: Stage macOS portable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/Apocalipse Download Manager.app"
          mkdir -p "$app/Contents/MacOS/data/tools/nibiru-xtreme" "$app/Contents/Resources"
          cp target/release/apocalipse-desktop "$app/Contents/MacOS/Apocalipse Download Manager"
          chmod +x "$app/Contents/MacOS/Apocalipse Download Manager"
          install -m 755 dist/xtreme-backend/nibiru-xtreme "$app/Contents/MacOS/data/tools/nibiru-xtreme/nibiru-xtreme"
          cp "$RUNNER_TEMP/media-routing.json" "$app/Contents/Resources/build-verification.json"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          python3 - "$app/Contents/Info.plist" <<'PYMAC'
          import plistlib
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as stream:
              version = tomllib.load(stream)["workspace"]["package"]["version"]
          version = version.split("-", 1)[0].split("+", 1)[0]
          path = sys.argv[1]
          with open(path, "rb") as stream:
              info = plistlib.load(stream)
          info["CFBundleShortVersionString"] = version
          info["CFBundleVersion"] = version
          with open(path, "wb") as stream:
              plistlib.dump(info, stream, sort_keys=False)
          PYMAC
          cp README.md README.en.md README.zh-CN.md LICENSE "$app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: apocalipse-download-manager-linux-x64-appimage
          path: dist/apocalipse-download-manager-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14


  extensions:
    name: Browser extensions test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for packaging checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension JavaScript
        run: |
          for file in browser-extension/*.js apps/desktop/ui/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Package Chrome, Edge and unsigned Firefox
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('browser-extension/manifest.json'))['version'])")
          mkdir -p dist
          stage=$(mktemp -d)
          cp -R browser-extension "$stage/chromium"
          (cd "$stage/chromium" && zip -qr "$GITHUB_WORKSPACE/dist/apocalipse-chrome-${version}.zip" .)
          cp "dist/apocalipse-chrome-${version}.zip" "dist/apocalipse-edge-${version}.zip"
          cp -R browser-extension "$stage/firefox"
          python3 - "$stage/firefox/manifest.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as stream:
              manifest = json.load(stream)
          manifest.pop("key", None)  # Chromium-only fixed extension ID
          worker = manifest.pop("background", {}).get("service_worker")
          if not worker:
              raise SystemExit("Chromium background service worker is missing")
          manifest["background"] = {"scripts": [worker]}
          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "apocalipse-download-manager@linuxhell",
                  "strict_min_version": "140.0",
                  "data_collection_permissions": {
                      "required": ["authenticationInfo", "browsingActivity", "websiteContent"]
                  }
              }
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY
          (cd "$stage/firefox" && zip -qr "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${version}-unsigned.xpi" .)
      - uses: actions/upload-artifact@v4
        with:
          name: apocalipse-browser-extensions-test
          path: |
            dist/apocalipse-chrome-*.zip
            dist/apocalipse-edge-*.zip
            dist/apocalipse-firefox-*-unsigned.xpi
          if-no-files-found: error
          retention-days: 14

  linux-compatibility:
    if: inputs.distribution_checks == true
    name: Linux compatibility · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:bookworm
          - name: Fedora
            image: fedora:latest
          - name: Arch Linux
            image: archlinux:latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian dependencies
        if: matrix.name == 'Debian 12'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpam0g-dev libssl-dev
      - name: Install Fedora dependencies
        if: matrix.name == 'Fedora'
        shell: bash
        run: |
          dnf install -y gcc gcc-c++ make curl pkgconf-pkg-config webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel pam-devel openssl-devel
      - name: Install Arch dependencies
        if: matrix.name == 'Arch Linux'
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel curl pkgconf webkit2gtk-4.1 libappindicator-gtk3 librsvg pam openssl
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Check desktop on distro
        shell: bash
        run: |
          . "$HOME/.cargo/env"
          cargo check --locked -p apocalipse-desktop
