name: Finalize diagnostic v3 candidate
on:
  push:
    branches: [feat/diagnostic-v3-correlated-capture]
    paths: [.github/workflows/finalize-diagnostic-v3.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow reviewed corrections
        shell: python
        run: |
          from pathlib import Path
          def edit(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              assert text.count(old)==1, path
              p.write_text(text.replace(old,new), encoding='utf-8')
          edit('apps/desktop/src-tauri/src/tiktok_preview.rs',
              '    let relay = Relay::bind(request, builder)?;\n    let trace = super::diagnostics_v3::valid_id(request.trace_id.as_deref())\n        .unwrap_or_else(|| uuid::Uuid::new_v4().to_string());',
              '    let trace = super::diagnostics_v3::valid_id(request.trace_id.as_deref())\n        .unwrap_or_else(|| uuid::Uuid::new_v4().to_string());\n    let relay = Relay::bind(request, builder)?;')
          edit('docs/DIAGNOSTICS_V3.md', 'Chromium smoke tests additionally check actual extension loading, controls and collection.', 'A Chromium DOM fixture with mocked Chrome APIs checked start/mark/stop controls, enabled and disabled rows, and correlated handoff IDs. Installed-extension testing is blocked by the administrator policy of the execution environment. This is not a test of the logged-in TikTok feed or Windows VLC.')
          edit('browser-extension/diagnostics.js', "    if (typeof value === 'number') return Number.isFinite(value) ? value : null;\n    if (sensitive.test(key)) return '[redacted]';", "    if (sensitive.test(key)) return '[redacted]';\n    if (typeof value === 'number') return Number.isFinite(value) ? value : null;")
          edit('apps/desktop/src-tauri/src/diagnostics_v3.rs', '    if value.is_boolean() || value.is_number() || value.is_null() {', '    if value.is_boolean() || value.is_null() {')
          edit('apps/desktop/src-tauri/src/diagnostics_v3.rs', '    if sensitive(key) {\n        return json!("[redacted]");\n    }\n    match value {', '    if sensitive(key) {\n        return json!("[redacted]");\n    }\n    if value.is_number() {\n        return value.clone();\n    }\n    match value {')
          p=Path('tests/diagnostics-v3.test.cjs')
          p.write_text(p.read_text(encoding='utf-8')+'''
          test('numeric credentials are scrubbed while measurement and presence fields remain useful', async () => {
            const h = harness(); await h.D.ready;
            const result = await h.D.safe({ token: 98123456, nested: { password: 98765432 }, bytes: 1234, hasToken: true });
            assert.equal(result.token, '[redacted]'); assert.equal(result.nested.password, '[redacted]');
            assert.equal(result.bytes, 1234); assert.equal(result.hasToken, true);
          });
          ''', encoding='utf-8')
          edit('apps/desktop/src-tauri/src/diagnostics_v3.rs', '    #[test]\n    fn unresolved_is_warning_and_identifiers_are_validated() {', '''    #[test]
              fn numeric_secrets_are_redacted_but_measurements_are_preserved() {
                  let value = json!({"token": 98123456, "password": 98765432, "bytes": 1234, "hasToken": true});
                  let result = safe(&value, "", 0);
                  assert_eq!(result["token"], json!("[redacted]"));
                  assert_eq!(result["password"], json!("[redacted]"));
                  assert_eq!(result["bytes"], json!(1234));
                  assert_eq!(result["hasToken"], json!(true));
              }
              #[test]
              fn unresolved_is_warning_and_identifiers_are_validated() {''')
          edit('browser-extension/diagnostics-popup.js', "pt_BR: ['Diagnostico v3'", "pt_BR: ['Diagn\u00f3stico v3'")
          edit('browser-extension/diagnostics-popup.js', "zh_CN: ['Diagnostic v3', 'Capture tab (5 min)', 'Mark problem', 'Stop', 'Idle', 'Capturing', 'Pending', 'Dropped', 'Delivery errors', 'Wait for Pending = 0 before exporting from ADM.'],", "zh_CN: ['\u8bca\u65ad v3', '\u91c7\u96c6\u6b64\u6807\u7b7e\u9875\uff085\u5206\u949f\uff09', '\u6807\u8bb0\u95ee\u9898', '\u505c\u6b62\u91c7\u96c6', '\u672a\u91c7\u96c6', '\u6b63\u5728\u91c7\u96c6', '\u5f85\u53d1\u9001', '\u5df2\u4e22\u5f03', '\u53d1\u9001\u5931\u8d25', '\u8bf7\u7b49\u5f85\u5f85\u53d1\u9001\u6570\u91cf\u4e3a0\u540e\u518d\u4eceADM\u5bfc\u51fa\u3002'],")
          edit('apps/desktop/ui/app.js', 'Object.assign(catalogs["zh-CN"], { markProblem: "Mark problem", copyDiagnosticReport: "Copy AI report", diagnosticHint: "Enable capture in the extension, reproduce, mark, then export." });', 'Object.assign(catalogs["zh-CN"], { markProblem: "\u6807\u8bb0\u95ee\u9898", copyDiagnosticReport: "\u590d\u5236 AI \u8bca\u65ad\u62a5\u544a", diagnosticHint: "\u5728\u6269\u5c55\u4e2d\u542f\u7528\u6807\u7b7e\u9875\u91c7\u96c6\uff0c\u91cd\u73b0\u95ee\u9898\u5e76\u6807\u8bb0\uff0c\u7136\u540e\u5bfc\u51fa\u8bca\u65ad\u3002" });')
          edit('apps/desktop/ui/app.js', 'copyDiagnosticReport: "Copiar relatorio para IA", diagnosticHint: "Na extensao, ative a captura da aba afetada, reproduza o erro, marque o problema e exporte o diagnostico."', 'copyDiagnosticReport: "Copiar relat\u00f3rio para IA", diagnosticHint: "Na extens\u00e3o, ative a captura da aba afetada, reproduza o erro, marque o problema e exporte o diagn\u00f3stico."')
          p=Path('browser-extension/popup.css')
          p.write_text(p.read_text(encoding='utf-8')+'''
          #diagnostic-v3 button { border: 1px solid #29404e; border-radius: 7px; padding: 8px 10px; background: #182e3a; color: #e9faff; cursor: pointer; }
          #diagnostic-v3 button:hover { background: #204758; }
          #diagnostic-v3 button:disabled { opacity: .6; cursor: wait; }
          #diagnostic-v3 button:focus-visible { outline: 2px solid #39e6ff; outline-offset: 2px; }
          ''', encoding='utf-8')
      - name: Validate and commit code only
        run: |
          set -euo pipefail
          cargo fmt --all
          for script in browser-extension/*.js; do node --check "$script"; done
          node --test tests/*.test.cjs
          git diff --check
          git add apps browser-extension docs tests
          git config user.name linuxhell
          git config user.email 38770145+linuxhell@users.noreply.github.com
          git commit -m 'fix: preserve preview trace before relay ownership and validate diagnostic privacy'
          git push origin HEAD:refs/heads/feat/diagnostic-v3-correlated-capture
