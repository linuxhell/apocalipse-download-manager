name: Rapidgator Windows test build

on:
  push:
    branches:
      - fix/rapidgator-preclick-0.3.29
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapidgator-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 portable test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply test patches
        run: |
          python .github/scripts/apply_fb_library_test.py
          python .github/scripts/apply_round_0_3_44.py
          python .github/scripts/fix_0_3_44_blob_status_route.py
          python .github/scripts/apply_round_0_3_45.py
          python .github/scripts/apply_round_0_3_46.py
          python .github/scripts/apply_round_0_3_47.py
          python .github/scripts/apply_round_0_3_48.py
          python .github/scripts/fix_round_0_3_49_source.py
          python .github/scripts/apply_round_0_3_49.py
          python .github/scripts/apply_round_0_3_50.py
          python .github/scripts/apply_round_0_3_51.py
          python .github/scripts/apply_round_0_3_52.py
          python .github/scripts/apply_round_0_3_53.py
          python .github/scripts/apply_round_0_3_54.py
          python .github/scripts/apply_round_0_3_55.py
          python .github/scripts/apply_round_0_3_56.py
          python .github/scripts/apply_round_0_3_57.py
          python .github/scripts/apply_round_0_3_58.py
          python .github/scripts/apply_round_0_3_59.py
          python .github/scripts/apply_round_0_3_60.py
      - name: Validate extension JavaScript
        run: |
          node --check browser-extension/content.js
          node --check browser-extension/background.js
          node --check browser-extension/page-hook.js
          node --check browser-extension/rapidgator.js
          node --check browser-extension/popup.js
          node --check apps/desktop/ui/app.js
          if (Select-String -Path browser-extension/manifest.json -Pattern '"debugger"' -Quiet) { throw 'debugger permission still present' }
          if (Select-String -Path browser-extension/*.js -Pattern 'chrome\.debugger|Fetch\.enable|Fetch\.requestPaused|Fetch\.takeResponseBodyAsStream|IO\.read|Page\.setDownloadBehavior|Browser\.setDownloadBehavior' -Quiet) { throw 'CDP code still present in shipped extension' }
          if (Select-String -Path browser-extension/service-worker.js -Pattern '/v1/site-rules' -Quiet) { throw 'stale site-rules bridge request still present' }
          if (-not (Select-String -Path apps/desktop/src-tauri/src/main.rs -Pattern 'Access-Control-Allow-Private-Network: true' -Quiet)) { throw 'local/private network preflight header missing' }
          if (-not (Select-String -Path browser-extension/popup.js -Pattern 'directBridgeHealth' -Quiet)) { throw 'direct popup pairing missing' }
          if (-not (Select-String -Path browser-extension/background.js -Pattern 'background\.importScripts\.error' -Quiet)) { throw 'worker bootstrap error instrumentation missing' }
          if (-not (Select-String -Path browser-extension/background.js -Pattern 'APOCALIPSE_WORKER_DIAGNOSTICS' -Quiet)) { throw 'worker diagnostics probe missing' }
          if (-not (Select-String -Path browser-extension/popup.js -Pattern 'workerSelfTest' -Quiet)) { throw 'popup worker self-test missing' }
          if (Select-String -Path apps/desktop/src-tauri/src/main.rs -Pattern 'start_file\("matrix-rules\.json"' -Quiet) { throw 'legacy matrix-rules.json still exported in diagnostics' }
          if (-not (Select-String -Path apps/desktop/ui/index.html -Pattern 'id="download-connections"' -Quiet)) { throw 'per-download thread slider missing' }
          if (-not (Select-String -Path apps/desktop/ui/app.js -Pattern 'connectionsOverride' -Quiet)) { throw 'per-download thread override not wired' }
          if (Select-String -Path apps/desktop/ui/app.js -Pattern 'document\.querySelector\("#manage-site-rules"\)\.onclick|document\.querySelector\("#pick-log-editor"\)\.onclick|document\.querySelector\("#open-log"\)\.onclick' -Quiet) { throw 'removed controls still have direct event handlers' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop
        run: cargo build --release --locked -p apocalipse-desktop
      - name: Package test build
        shell: pwsh
        run: |
          $version = (Get-Content "browser-extension/manifest.json" -Raw | ConvertFrom-Json).version
          $package = "dist/Apocalipse Download Manager Shortcut Logs Test $version"
          New-Item -ItemType Directory -Force "$package/browser extensions" | Out-Null
          Copy-Item "target/release/apocalipse-desktop.exe" "$package/Apocalipse Download Manager.exe"
          Copy-Item "browser-extension" "$package/browser extensions/unpacked-development-extension" -Recurse
          Compress-Archive -Path "browser-extension/*" -DestinationPath "$package/browser extensions/apocalipse-chrome-$version.zip" -Force
          Copy-Item "$package/browser extensions/apocalipse-chrome-$version.zip" "$package/browser extensions/apocalipse-edge-$version.zip" -Force
          Copy-Item "README.md","LICENSE" $package
          Compress-Archive -Path $package -DestinationPath "dist/apocalipse-download-manager-windows-x64-shortcut-logs-test-$version.zip"
      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: apocalipse-windows-shortcut-logs-test
          path: dist/apocalipse-download-manager-windows-x64-shortcut-logs-test-*.zip
          if-no-files-found: error
          retention-days: 14
