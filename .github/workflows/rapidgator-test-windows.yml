name: Rapidgator Windows test build

on:
  push:
    branches:
      - fix/rapidgator-preclick-0.3.29
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapidgator-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 portable test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Facebook and ChatGPT Library test patches
        shell: pwsh
        run: |
          $p = "browser-extension/content.js"
          $s = Get-Content $p -Raw
          if ($s -notmatch "APOCALIPSE_CHATGPT_LIBRARY_DIRECT") {
            $anchor = '  const copyTextNow = (value) => {'
            $direct = @'
  // Intercept ChatGPT Library links before Chrome creates its own download dialog.
  document.addEventListener("click", (event) => {
    if (event.defaultPrevented || event.button !== 0) return;
    const anchor = event.target.closest?.('a[href*="/backend-api/estuary/content"]');
    if (!anchor) return;
    let url = null;
    try {
      const parsed = new URL(anchor.href, location.href);
      if (parsed.hostname.toLowerCase() === "chatgpt.com" && parsed.pathname === "/backend-api/estuary/content") url = parsed.href;
    } catch {}
    if (!url) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    chrome.runtime.sendMessage({ type: "APOCALIPSE_CHATGPT_LIBRARY_DIRECT", url, pageUrl: location.href, fileName: anchor.getAttribute("download") || "" }).catch(() => {});
  }, true);

'@
            if (-not $s.Contains($anchor)) { throw "content anchor missing" }
            $s = $s.Replace($anchor, $direct + $anchor)
          }
          $old = @'
  const revealFacebookUrl = async (element) => {
    const immediate = facebookUrlFor(element);
    if (immediate) return immediate;
    if (!/(^|\.)facebook\.com$/i.test(location.hostname)) return null;
    const postText = element.closest?.('[role="article"],article')?.textContent || "";
    if (/(?:patrocinado|sponsored)/i.test(postText)) {
      const menuUrl = await facebookUrlFromMenu(element);
      if (menuUrl) return menuUrl;
    }
'@
          $new = @'
  const revealFacebookUrl = async (element) => {
    if (!/(^|\.)facebook\.com$/i.test(location.hostname)) return null;
    const postText = element.closest?.('[role="article"],article')?.textContent || "";
    // Sponsored/non-friend cards can expose a landing URL; Copy link has the canonical video URL.
    if (/(?:patrocinado|sponsored)/i.test(postText)) {
      const menuUrl = await facebookUrlFromMenu(element);
      if (menuUrl) return menuUrl;
    }
    const immediate = facebookUrlFor(element);
    if (immediate) return immediate;
'@
          if ($s.Contains($old)) { $s = $s.Replace($old, $new) }
          Set-Content $p $s -NoNewline

          $p = "browser-extension/background.js"
          $s = Get-Content $p -Raw
          $s = $s.Replace('  if (!url || !item?.id || chatgptLibraryTransfers.has(item.id)) return;`n  chatgptLibraryTransfers.add(item.id);'.Replace('`n',"`n"), '  if (!url) return;`n  const transferKey = Number.isInteger(item?.id) ? ``download:${item.id}`` : ``direct:${url}``;`n  if (chatgptLibraryTransfers.has(transferKey)) return;`n  chatgptLibraryTransfers.add(transferKey);'.Replace('`n',"`n").Replace('``','`'))
          $s = $s.Replace('    await diagnostic("chatgpt.library.intercepted", state, { detail: `download_id=${item.id}` });`n    await cancelChromeDownload(item.id);`n    await eraseChromeDownload(item.id);'.Replace('`n',"`n"), '    await diagnostic("chatgpt.library.intercepted", state, { detail: Number.isInteger(item?.id) ? `download_id=${item.id}` : "direct_click=1" });`n    if (Number.isInteger(item?.id)) {`n      await cancelChromeDownload(item.id);`n      await eraseChromeDownload(item.id);`n    }'.Replace('`n',"`n"))
          $s = $s.Replace('    chatgptLibraryTransfers.delete(item.id);', '    chatgptLibraryTransfers.delete(transferKey);')
          if ($s -notmatch "invalid_chatgpt_library_url") {
            $marker = @'
chrome.downloads.onCreated.addListener((item) => {
  if (!chatgptLibraryUrl(item?.finalUrl || item?.url || "")) return;
  void streamChatGPTLibraryDownload(item);
});
'@
            $handler = @'

chrome.runtime.onMessage.addListener((message, sender, reply) => {
  if (message?.type !== "APOCALIPSE_CHATGPT_LIBRARY_DIRECT") return;
  const url = chatgptLibraryUrl(message.url || "");
  if (!url) { reply({ ok: false, error: "invalid_chatgpt_library_url" }); return; }
  void streamChatGPTLibraryDownload({ url, referrer: message.pageUrl || sender.tab?.url || "https://chatgpt.com/", filename: message.fileName || "" });
  reply({ ok: true, target: "apocalipse" });
});
'@
            if (-not $s.Contains($marker)) { throw "background marker missing" }
            $s = $s.Replace($marker, $marker + $handler)
          }
          Set-Content $p $s -NoNewline
          $p = "browser-extension/manifest.json"
          $s = (Get-Content $p -Raw).Replace('"version": "0.3.40"','"version": "0.3.41"')
          Set-Content $p $s -NoNewline
          node --check browser-extension/content.js
          node --check browser-extension/background.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop
        run: cargo build --release --locked -p apocalipse-desktop
      - name: Package test build
        shell: pwsh
        run: |
          $version = (Get-Content "browser-extension/manifest.json" -Raw | ConvertFrom-Json).version
          $package = "dist/Apocalipse Download Manager Rapidgator Test $version"
          New-Item -ItemType Directory -Force "$package/browser extensions" | Out-Null
          Copy-Item "target/release/apocalipse-desktop.exe" "$package/Apocalipse Download Manager.exe"
          Copy-Item "browser-extension" "$package/browser extensions/unpacked-development-extension" -Recurse
          Compress-Archive -Path "browser-extension/*" -DestinationPath "$package/browser extensions/apocalipse-chrome-$version.zip" -Force
          Copy-Item "$package/browser extensions/apocalipse-chrome-$version.zip" "$package/browser extensions/apocalipse-edge-$version.zip" -Force
          Copy-Item "README.md","LICENSE" $package
          Compress-Archive -Path $package -DestinationPath "dist/apocalipse-download-manager-windows-x64-rapidgator-test-$version.zip"
      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: apocalipse-windows-rapidgator-test
          path: dist/apocalipse-download-manager-windows-x64-rapidgator-test-*.zip
          if-no-files-found: error
          retention-days: 14
