name: Normalize generated Rust formatting
on:
  push:
    branches: [fix/rapidgator-preclick-0.3.29]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: fix/rapidgator-preclick-0.3.29 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - name: Format generated Rust sources
        run: cargo fmt --all
      - name: Commit normalized formatting
        run: |
          rm .github/workflows/fix-generated-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: normalize generated Rust formatting"
          git push
