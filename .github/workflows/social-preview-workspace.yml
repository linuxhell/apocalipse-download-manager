name: Social preview workspace (temporary)
on:
  push:
    branches: [fix/vlc-preview-local-relay]
    paths: [.github/workflows/social-preview-workspace.yml, .social-preview.patch, .repair-facebook-players.py]
permissions:
  contents: write
concurrency:
  group: social-preview-workspace
  cancel-in-progress: false
jobs:
  workspace:
    if: github.repository == 'linuxhell/apocalipse-download-manager' && github.ref == 'refs/heads/fix/vlc-preview-local-relay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply reviewed repairs on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          if [[ -f .repair-facebook-players.py ]]; then
            python3 .repair-facebook-players.py
            git rm .repair-facebook-players.py
            git add browser-extension/content.js apps/desktop/src-tauri/src/tiktok_preview.rs apps/desktop/src-tauri/src/tiktok_preview/tests.rs crates/apocalipse-core/tests/facebook_page_strategy.rs
            changed=true
          fi
          if [[ -f .social-preview.patch ]]; then
            python3 - <<'PY'
          import base64, gzip, pathlib
          data = pathlib.Path('.social-preview.patch').read_bytes()
          if not data.startswith(b'diff --git '):
              data = gzip.decompress(base64.b64decode(data))
          pathlib.Path('/tmp/social-preview.patch').write_bytes(data)
          PY
            git apply --check /tmp/social-preview.patch
            git apply --index /tmp/social-preview.patch
            git rm .social-preview.patch
            changed=true
          fi
          if [[ "$changed" == true ]]; then
            cargo fmt --all
            node --check browser-extension/background.js
            node --check browser-extension/content.js
            node --check browser-extension/popup.js
            node --check apps/desktop/ui/app.js
            node --test tests/*.test.cjs
            git add -u
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: restore full Facebook Reel extraction and retain external player handoffs'
            git push origin HEAD:refs/heads/fix/vlc-preview-local-relay
          fi
      - name: Export exact source snapshot
        shell: bash
        run: |
          mkdir -p /tmp/social-preview-source
          git archive --format=tar HEAD | gzip > /tmp/social-preview-source/source.tar.gz
          git rev-parse HEAD > /tmp/social-preview-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: social-preview-source
          path: /tmp/social-preview-source/*
          retention-days: 2
          if-no-files-found: error
