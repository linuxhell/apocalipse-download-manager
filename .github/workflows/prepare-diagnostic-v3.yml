name: Prepare diagnostic v3 candidate
on:
  push:
    branches: [feat/diagnostic-v3-correlated-capture]
    paths: [.github/workflows/prepare-diagnostic-v3.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/diagnostic-v3-correlated-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply candidate source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.diagnostic-transfer')
          encoded = ''.join((root / f'part-{i}.txt').read_text().strip() for i in range(1, 6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 118772
          assert hashlib.sha256(patch).hexdigest() == '656b0381b27d1b07def924043856b377d2c1254f74e1bfe36eb1f0f11408418b'
          pathlib.Path('/tmp/diagnostic-v3.patch').write_bytes(patch)
          PY
          git apply --check /tmp/diagnostic-v3.patch
          git apply --index /tmp/diagnostic-v3.patch
          cargo fmt --all
          for script in browser-extension/*.js; do node --check "$script"; done
          node --test tests/*.test.cjs
          git diff --check
      - name: Commit source and remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .diagnostic-transfer
          git rm .github/workflows/prepare-diagnostic-v3.yml
          git add -A
          git config user.name 'linuxhell'
          git config user.email '38770145+linuxhell@users.noreply.github.com'
          git commit -m 'feat: correlated privacy-filtered diagnostic v3 candidates'
          git push origin HEAD:refs/heads/feat/diagnostic-v3-correlated-capture
          mkdir -p /tmp/diagnostic-candidate
          git archive --format=zip HEAD > /tmp/diagnostic-candidate/diagnostic-source.zip
          git rev-parse HEAD > /tmp/diagnostic-candidate/commit.txt
          git rev-parse 'HEAD^{tree}' > /tmp/diagnostic-candidate/tree.txt
          sha256sum /tmp/diagnostic-candidate/diagnostic-source.zip > /tmp/diagnostic-candidate/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-v3-verified-source
          path: /tmp/diagnostic-candidate/*
          retention-days: 14
          if-no-files-found: error
