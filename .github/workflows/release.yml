# Release publication re-enabled and triggered by explicit repository-owner authorization.
name: Release builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "README*.md"
      - "docs/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-publication
  # A corrected main commit supersedes an obsolete build before publication.
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish clean release
    needs: validate
    # Never publish from a feature branch started by workflow_dispatch.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for packaging checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: apocalipse-download-manager-*
          merge-multiple: true

      - name: Package current browser extensions
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('browser-extension/manifest.json'))['version'])")
          stage=$(mktemp -d)
          cp -R browser-extension "$stage/chromium"
          (cd "$stage/chromium" && zip -qr "$GITHUB_WORKSPACE/dist/apocalipse-chrome-${version}.zip" .)
          cp "$GITHUB_WORKSPACE/dist/apocalipse-chrome-${version}.zip" "$GITHUB_WORKSPACE/dist/apocalipse-edge-${version}.zip"

          signed="packaging/firefox/apocalipse-firefox-${version}.xpi"
          shopt -s nullglob
          signed_parts=(packaging/firefox/apocalipse-firefox-${version}.xpi.b64.part*)
          if [[ ! -f "$signed" && ${#signed_parts[@]} -gt 0 ]]; then
            cat "${signed_parts[@]}" | base64 --decode > "$signed"
          fi
          fallback_version=$(python3 - <<'PY'
          import glob
          import re

          versions = set()
          for path in glob.glob("packaging/firefox/apocalipse-firefox-*.xpi*"):
              match = re.search(r"apocalipse-firefox-(\d+(?:\.\d+)*)\.xpi(?:\.b64\.part\d+)?$", path)
              if match:
                  versions.add(tuple(int(part) for part in match.group(1).split(".")))
          print(".".join(str(part) for part in max(versions)) if versions else "")
          PY
          )
          if [[ -f "$signed" ]]; then
            # A damaged or mislabeled signed package must stop the release.
            unzip -tq "$signed"
            python3 - "$signed" "$version" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              shipped = json.loads(archive.read("manifest.json"))["version"]
              if "META-INF/mozilla.rsa" not in archive.namelist():
                  raise SystemExit("Firefox XPI is not Mozilla-signed")
          expected = json.load(open("browser-extension/manifest.json", encoding="utf-8"))["version"]
          if shipped != expected:
              raise SystemExit(f"Signed XPI is {shipped}, extension manifest is {expected}")
          PY
            cp "$signed" "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${version}.xpi"
          elif [[ -n "$fallback_version" ]]; then
            # An unsigned XPI cannot be installed in release Firefox. Until a signed
            # package for this version is added, keep shipping the newest signed one.
            fallback="packaging/firefox/apocalipse-firefox-${fallback_version}.xpi"
            fallback_parts=(packaging/firefox/apocalipse-firefox-${fallback_version}.xpi.b64.part*)
            if [[ ! -f "$fallback" && ${#fallback_parts[@]} -gt 0 ]]; then
              cat "${fallback_parts[@]}" | base64 --decode > "$fallback"
            fi
            cp "$fallback" "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${fallback_version}.xpi"
            echo "::warning::No signed Firefox XPI for extension ${version}; publishing the signed ${fallback_version} package."
          else
            cp -R browser-extension "$stage/firefox"
            python3 - "$stage/firefox/manifest.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as stream:
              manifest = json.load(stream)
          manifest.pop("key", None)  # Chromium-only fixed extension ID
          worker = manifest.pop("background", {}).get("service_worker")
          if not worker:
              raise SystemExit("Chromium background service worker is missing")
          manifest["background"] = {"scripts": [worker]}
          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "apocalipse-download-manager@linuxhell",
                  "strict_min_version": "140.0",
                  "data_collection_permissions": {
                      "required": [
                          "authenticationInfo",
                          "browsingActivity",
                          "websiteContent"
                      ]
                  }
              }
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY
            (cd "$stage/firefox" && zip -qr "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${version}-unsigned.xpi" .)
          fi

      - name: Publish validated release without replacing another commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Release tag must match Cargo version: $tag"
            exit 1
          fi

          # Fail before tagging anything when the notes are missing.
          if [[ ! -f "packaging/release-notes-v${version}.md" ]]; then
            echo "::error::packaging/release-notes-v${version}.md is missing"
            exit 1
          fi

          # Keep an existing version tag fixed. Reusing it is allowed only when
          # every change since the tagged product commit is release packaging.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$tag"
            tagged_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              changed_paths=$(git diff --name-only "$tagged_commit..$GITHUB_SHA")
              invalid_paths=$(printf '%s\n' "$changed_paths" | grep -Ev '^(\.github/workflows/[^/]+\.yml|packaging/firefox/[^/]+|packaging/release-[^/]+)$' || true)
              if [[ -n "$invalid_paths" ]]; then
                echo "::error::$tag belongs to another product commit. Only release packaging changes may reuse the existing tag."
                printf '%s\n' "$invalid_paths"
                exit 1
              fi
              echo "::notice::Recreating assets for existing $tag without moving the tag."
            fi
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check the remote release tag."
              exit "$status"
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          if is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "::notice::$tag already exists; replacing its assets."
            fi
          else
            prerelease=()
            if [[ "$version" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$tag" --verify-tag --notes-file "packaging/release-notes-v${version}.md" --draft "${prerelease[@]}"
          fi

          (cd dist && sha256sum apocalipse-*) > dist/SHA256SUMS.txt
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --notes-file "packaging/release-notes-v${version}.md" --draft=false

