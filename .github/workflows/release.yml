# Release publication is intentionally disabled by the repository owner.
# Test builds are produced ONLY by validate-portable.yml as Actions artifacts.
# Do not restore push/tag publication without a new explicit owner request.
name: Release publication disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain test-only policy
        run: |
          echo 'Release publication is disabled. Use Validate portable candidates.'
          echo 'No release, tag, or release asset is created by this workflow.'
