# Release publication re-enabled and triggered by explicit repository-owner authorization.
name: Release builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 portable
            os: windows-latest
            artifact: apocalipse-download-manager-windows-x64-portable
            output: apocalipse-download-manager-windows-x64-portable.zip
          - name: Linux x64 portable
            os: ubuntu-latest
            artifact: apocalipse-download-manager-linux-x64-portable
            output: apocalipse-download-manager-linux-x64-portable.tar.gz
          - name: macOS x64 portable
            os: macos-15-intel
            artifact: apocalipse-download-manager-macos-x64-portable
            output: apocalipse-download-manager-macos-x64-portable.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpam0g-dev patchelf ffmpeg

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      - name: Validate
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo update -p zip --precise 2.4.2
          cargo test --workspace --locked

      - name: Verify prepared media with FFmpeg and FFprobe
        if: runner.os == 'Linux'
        run: |
          cargo test -p apocalipse-desktop --locked paired_preview_uses_real_mux_and_probe -- --ignored
          cargo test -p apocalipse-desktop --locked direct_audio_conversion_produces_requested_format_and_preserves_existing_files -- --ignored
      - name: Build desktop
        run: cargo build --release --locked -p apocalipse-desktop

      - name: Verify routing in release executable
        shell: bash
        run: |
          binary="target/release/apocalipse-desktop"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          "$binary" --verify-media-routing "$RUNNER_TEMP/media-routing.json"
          python3 - "$RUNNER_TEMP/media-routing.json" <<'PYVERIFY'
          import json, sys, tomllib
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["verified"] is True, report
          with open("Cargo.toml", "rb") as cargo:
              expected_version = tomllib.load(cargo)["workspace"]["package"]["version"]
          assert report["version"] == expected_version, report
          assert report["engine"] == "yt_dlp", report
          print(json.dumps(report))
          PYVERIFY

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd apps/desktop
          npx --yes @tauri-apps/cli@2 build --bundles appimage

      - name: Build pinned Nibiru engines
        shell: bash
        run: python3 scripts/build_nibiru_engines.py --output dist/nibiru-tools --require-all

      - name: Verify actual native engine adapters
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export NIBIRU_XTREME_BIN="$PWD/dist/nibiru-tools/nibiru-xtreme/nibiru-xtreme$suffix"
          export NIBIRU_M3U8_BIN="$PWD/dist/nibiru-tools/nibiru-m3u8/nibiru-m3u8$suffix"
          export NIBIRU_POWER_BIN="$PWD/dist/nibiru-tools/nibiru-power/nibiru-power$suffix"
          export NIBIRU_COLAPSE_BIN="$PWD/dist/nibiru-tools/nibiru-colapse/nibiru-colapse$suffix"
          cargo test --locked -p apocalipse-desktop real_native_runtime_serves_adm_rpc_and_downloads_http -- --ignored
          cargo test --locked -p apocalipse-desktop real_engine_download_progress_and_publication -- --ignored
          cargo test --locked -p apocalipse-desktop nibiru::adapter::tests::real_power_extract_uses_the_adm_runner_and_media_conversion -- --ignored --exact
          cargo test --locked -p apocalipse-desktop nibiru::adapter::tests::real_colapse_executes_all_eleven_typed_adm_operations -- --ignored --exact

      - name: Stage Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/Apocalipse Download Manager"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "target/release/apocalipse-desktop.exe" "$package/Apocalipse Download Manager.exe"
          New-Item -ItemType Directory -Force "$package/data/tools" | Out-Null
          Copy-Item "dist/nibiru-tools/*" "$package/data/tools/" -Recurse -Force
          Copy-Item "README.md","LICENSE" $package
          Copy-Item "$env:RUNNER_TEMP/media-routing.json" "$package/build-verification.json"
          Compress-Archive -Path $package -DestinationPath "dist/${{ matrix.output }}" -Force

      - name: Stage Linux portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="dist/Apocalipse Download Manager"
          mkdir -p "$package/data/tools/nibiru-xtreme"
          install -m 755 target/release/apocalipse-desktop "$package/apocalipse-download-manager"
          cp -R dist/nibiru-tools/. "$package/data/tools/"
          cp README.md LICENSE "$package/"
          cp "$RUNNER_TEMP/media-routing.json" "$package/build-verification.json"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          install -m 755 "$appimage" "dist/apocalipse-download-manager-linux-x64.AppImage"
          tar -C dist -czf "dist/${{ matrix.output }}" "Apocalipse Download Manager"

      - name: Stage macOS portable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/Apocalipse Download Manager.app"
          mkdir -p "$app/Contents/MacOS/data/tools/nibiru-xtreme" "$app/Contents/Resources"
          cp target/release/apocalipse-desktop "$app/Contents/MacOS/Apocalipse Download Manager"
          chmod +x "$app/Contents/MacOS/Apocalipse Download Manager"
          cp -R dist/nibiru-tools/. "$app/Contents/MacOS/data/tools/"
          cp "$RUNNER_TEMP/media-routing.json" "$app/Contents/Resources/build-verification.json"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          python3 - "$app/Contents/Info.plist" <<'PYMAC'
          import plistlib
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as stream:
              version = tomllib.load(stream)["workspace"]["package"]["version"]
          version = version.split("-", 1)[0].split("+", 1)[0]
          path = sys.argv[1]
          with open(path, "rb") as stream:
              info = plistlib.load(stream)
          info["CFBundleShortVersionString"] = version
          info["CFBundleVersion"] = version
          with open(path, "wb") as stream:
              plistlib.dump(info, stream, sort_keys=False)
          PYMAC
          cp README.md LICENSE "$app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: apocalipse-download-manager-linux-x64-appimage
          path: dist/apocalipse-download-manager-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish clean release
    needs: build
    # Never publish from a feature branch started by workflow_dispatch.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate extension handoffs before publication
        run: |
          for file in browser-extension/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package current browser extensions
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('browser-extension/manifest.json'))['version'])")
          stage=$(mktemp -d)
          cp -R browser-extension "$stage/chromium"
          (cd "$stage/chromium" && zip -qr "$GITHUB_WORKSPACE/dist/apocalipse-chrome-${version}.zip" .)
          cp "$GITHUB_WORKSPACE/dist/apocalipse-chrome-${version}.zip" "$GITHUB_WORKSPACE/dist/apocalipse-edge-${version}.zip"

          signed="packaging/firefox/apocalipse-firefox-${version}.xpi"
          shopt -s nullglob
          signed_parts=(packaging/firefox/apocalipse-firefox-${version}.xpi.b64.part*)
          if [[ ! -f "$signed" && ${#signed_parts[@]} -gt 0 ]]; then
            cat "${signed_parts[@]}" | base64 --decode > "$signed"
          fi
          fallback_version=$(python3 - <<'PY'
          import glob
          import re

          versions = set()
          for path in glob.glob("packaging/firefox/apocalipse-firefox-*.xpi*"):
              match = re.search(r"apocalipse-firefox-(\d+(?:\.\d+)*)\.xpi(?:\.b64\.part\d+)?$", path)
              if match:
                  versions.add(tuple(int(part) for part in match.group(1).split(".")))
          print(".".join(str(part) for part in max(versions)) if versions else "")
          PY
          )
          if [[ -f "$signed" ]]; then
            # A damaged or mislabeled signed package must stop the release.
            unzip -tq "$signed"
            python3 - "$signed" "$version" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              shipped = json.loads(archive.read("manifest.json"))["version"]
              if "META-INF/mozilla.rsa" not in archive.namelist():
                  raise SystemExit("Firefox XPI is not Mozilla-signed")
          expected = json.load(open("browser-extension/manifest.json", encoding="utf-8"))["version"]
          if shipped != expected:
              raise SystemExit(f"Signed XPI is {shipped}, extension manifest is {expected}")
          PY
            cp "$signed" "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${version}.xpi"
          elif [[ -n "$fallback_version" ]]; then
            # An unsigned XPI cannot be installed in release Firefox. Until a signed
            # package for this version is added, keep shipping the newest signed one.
            fallback="packaging/firefox/apocalipse-firefox-${fallback_version}.xpi"
            fallback_parts=(packaging/firefox/apocalipse-firefox-${fallback_version}.xpi.b64.part*)
            if [[ ! -f "$fallback" && ${#fallback_parts[@]} -gt 0 ]]; then
              cat "${fallback_parts[@]}" | base64 --decode > "$fallback"
            fi
            cp "$fallback" "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${fallback_version}.xpi"
            echo "::warning::No signed Firefox XPI for extension ${version}; publishing the signed ${fallback_version} package."
          else
            cp -R browser-extension "$stage/firefox"
            python3 - "$stage/firefox/manifest.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as stream:
              manifest = json.load(stream)
          manifest.pop("key", None)  # Chromium-only fixed extension ID
          worker = manifest.pop("background", {}).get("service_worker")
          if not worker:
              raise SystemExit("Chromium background service worker is missing")
          manifest["background"] = {"scripts": [worker]}
          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "apocalipse-download-manager@linuxhell",
                  "strict_min_version": "140.0",
                  "data_collection_permissions": {
                      "required": [
                          "authenticationInfo",
                          "browsingActivity",
                          "websiteContent"
                      ]
                  }
              }
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY
            (cd "$stage/firefox" && zip -qr "$GITHUB_WORKSPACE/dist/apocalipse-firefox-${version}-unsigned.xpi" .)
          fi

      - name: Publish validated release without replacing another commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Release tag must match Cargo version: $tag"
            exit 1
          fi

          # Fail before tagging anything when the notes are missing.
          if [[ ! -f "packaging/release-notes-v${version}.md" ]]; then
            echo "::error::packaging/release-notes-v${version}.md is missing"
            exit 1
          fi

          # Keep an existing version tag fixed. Reusing it is allowed only when
          # every change since the tagged product commit is release packaging.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$tag"
            tagged_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              changed_paths=$(git diff --name-only "$tagged_commit..$GITHUB_SHA")
              invalid_paths=$(printf '%s\n' "$changed_paths" | grep -Ev '^(\.github/workflows/[^/]+\.yml|packaging/firefox/[^/]+|packaging/release-[^/]+)$' || true)
              if [[ -n "$invalid_paths" ]]; then
                echo "::error::$tag belongs to another product commit. Only release packaging changes may reuse the existing tag."
                printf '%s\n' "$invalid_paths"
                exit 1
              fi
              echo "::notice::Recreating assets for existing $tag without moving the tag."
            fi
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "::error::Could not check the remote release tag."
              exit "$status"
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          if is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "::notice::$tag already exists; replacing its assets."
            fi
          else
            prerelease=()
            if [[ "$version" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$tag" --verify-tag --notes-file "packaging/release-notes-v${version}.md" --draft "${prerelease[@]}"
          fi

          (cd dist && sha256sum apocalipse-*) > dist/SHA256SUMS.txt
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --notes-file "packaging/release-notes-v${version}.md" --draft=false

