# One-time source import for the owner's diagnostic test candidate.
# This workflow NEVER creates a release or a tag; it pushes this branch only.
name: Prepare diagnostics test candidate

on:
  push:
    branches: [feat/diagnostics-v3-test-only]
    paths: ['.github/workflows/import-diagnostics-candidate.yml']

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'linuxhell/apocalipse-download-manager' && github.ref == 'refs/heads/feat/diagnostics-v3-test-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply authored diagnostic source
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess
          subprocess.run(['git','merge-base','--is-ancestor','f40d5227aea77c453c714a26bc60377d4035a854','HEAD'], check=True)
          source = pathlib.Path('.github/diagnostics-import')
          encoded = ''.join((source / f'part-{i}.b64').read_text().strip() for i in range(3))
          packed = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor(memlimit=256 * 1024 * 1024)
          patch = decoder.decompress(packed, max_length=200000)
          assert decoder.eof and not decoder.unused_data, 'Incomplete or oversized source patch'
          assert len(patch) == 139459, f'Wrong patch size: {len(patch)}'
          assert hashlib.sha256(patch).hexdigest() == '4934ae0f77f0d7137f047af4d7232eeafc4aeb6b6372ecaef9ae110e3d6fac76', 'Patch checksum mismatch'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'diagnostics-v3.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)], check=True)
          subprocess.run(['git','apply',str(path)], check=True)
          shutil.rmtree(source)
          pathlib.Path('.github/workflows/import-diagnostics-candidate.yml').unlink()
      - name: Format Rust and test JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          for file in browser-extension/*.js apps/desktop/ui/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
          git diff --check
      - name: Commit formatted test source on candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: opt-in diagnostic v3 traces and AI report (test candidate only)'
          git push origin HEAD:refs/heads/feat/diagnostics-v3-test-only
          git archive --format=zip HEAD -o "$RUNNER_TEMP/diagnostics-formatted-source.zip"
          {
            echo '## Diagnostics test source prepared'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Tree: $(git rev-parse 'HEAD^{tree}')"
            echo 'JavaScript tests and Rust formatting passed. Native compilation remains for PR validation.'
            echo 'No releases or tags were created.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-formatted-source
          path: ${{ runner.temp }}/diagnostics-formatted-source.zip
          if-no-files-found: error
          retention-days: 14
