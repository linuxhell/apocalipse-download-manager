name: Prepare TikTok preview (temporary)

on:
  push:
    branches: [fix/vlc-preview-local-relay]
    paths:
      - .github/workflows/prepare-tiktok-preview.yml
      - .tiktok-preview-apply.py

permissions:
  contents: write

concurrency:
  group: prepare-tiktok-preview
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'linuxhell/apocalipse-download-manager' && github.ref == 'refs/heads/fix/vlc-preview-local-relay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked integration edits and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 .tiktok-preview-apply.py
          cargo fmt --all
          node --check browser-extension/background.js
          node --check browser-extension/popup.js
          node --check apps/desktop/ui/app.js
          node --test tests/*.test.cjs
          git rm .tiktok-preview-apply.py .github/workflows/prepare-tiktok-preview.yml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: route direct TikTok previews through bounded local streaming'
          git push origin HEAD:refs/heads/fix/vlc-preview-local-relay
      - name: Export source for independent inspection
        shell: bash
        run: |
          mkdir -p /tmp/tiktok-preview-source
          git archive --format=tar HEAD | gzip > /tmp/tiktok-preview-source/source.tar.gz
          git rev-parse HEAD > /tmp/tiktok-preview-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-preview-source
          path: /tmp/tiktok-preview-source/*
          retention-days: 2
          if-no-files-found: error
