name: Validate portable candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches:
      - main
      - engine/aria2-maintained

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensions:
    name: Extension regression tests and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test extension handoffs
        run: |
          for file in browser-extension/*.js apps/desktop/ui/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Package extension candidates
        shell: python
        run: |
          import copy, json, pathlib, zipfile
          source = pathlib.Path('browser-extension')
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          firefox = copy.deepcopy(manifest)
          worker = firefox.pop('background')['service_worker']
          firefox['background'] = {'scripts': ['diagnostics-core.js', 'diagnostics-worker.js', worker]}
          firefox['browser_specific_settings'] = {'gecko': {
              'id': 'apocalipse-download-manager@linuxhell',
              'strict_min_version': '140.0',
              'data_collection_permissions': {'required': ['authenticationInfo', 'browsingActivity', 'websiteContent']}
          }}
          for browser, suffix in [('chrome', '.zip'), ('edge', '.zip'), ('firefox', '-unsigned.xpi')]:
              with zipfile.ZipFile(dist / f'apocalipse-{browser}-{version}{suffix}', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(source.rglob('*')):
                      if not path.is_file():
                          continue
                      relative = path.relative_to(source).as_posix()
                      if browser == 'firefox' and relative == 'manifest.json':
                          archive.writestr(relative, json.dumps(firefox, ensure_ascii=False, indent=2) + '\n')
                      else:
                          archive.write(path, relative)
          signed = pathlib.Path('packaging/firefox') / f'apocalipse-firefox-{version}.xpi'
          if signed.is_file():
              (dist / f'apocalipse-firefox-{version}.xpi').write_bytes(signed.read_bytes())
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension-candidates
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  linux-compatibility:
    name: Linux compatibility · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:bookworm
          - name: Fedora
            image: fedora:latest
          - name: Arch Linux
            image: archlinux:latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Debian dependencies
        if: matrix.name == 'Debian 12'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpam0g-dev libssl-dev
      - name: Install Fedora dependencies
        if: matrix.name == 'Fedora'
        shell: bash
        run: |
          dnf install -y gcc gcc-c++ make curl pkgconf-pkg-config webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel pam-devel openssl-devel
      - name: Install Arch dependencies
        if: matrix.name == 'Arch Linux'
        shell: bash
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel curl pkgconf webkit2gtk-4.1 libappindicator-gtk3 librsvg pam openssl
      - name: Install Rust
        shell: bash
        run: |
          export HOME=/root
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check desktop on distro
        shell: bash
        run: |
          export HOME=/root
          . "$HOME/.cargo/env"
          cargo check -p apocalipse-desktop

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 portable
            os: windows-latest
            artifact: apocalipse-windows-x64-candidate
            output: apocalipse-download-manager-windows-x64-portable.zip
            aria2_suffix: windows-x64.exe
            aria2_binary: aria2c.exe
          - name: Linux x64 portable
            os: ubuntu-22.04
            artifact: apocalipse-linux-x64-candidate
            output: apocalipse-download-manager-linux-x64-portable.tar.gz
            aria2_suffix: linux-x64
            aria2_binary: aria2c
          - name: macOS x64 portable
            os: macos-15-intel
            artifact: apocalipse-macos-x64-candidate
            output: apocalipse-download-manager-macos-x64-portable.zip
            aria2_suffix: macos-x64
            aria2_binary: aria2c
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libpam0g-dev patchelf ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The Linux build moved from ubuntu-latest to ubuntu-22.04 for broader
          # glibc compatibility. Keep target artifacts isolated by runner image
          # so crates compiled on Ubuntu 24.04 are never restored on Ubuntu 22.04.
          key: ${{ matrix.os }}
      - name: Validate formatting and workspace tests
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Verify prepared media with FFmpeg and FFprobe
        if: runner.os == 'Linux'
        run: cargo test -p apocalipse-desktop paired_preview_uses_real_mux_and_probe -- --ignored
      - name: Build desktop candidate
        run: cargo build --release -p apocalipse-desktop
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd apps/desktop
          npx --yes @tauri-apps/cli@2 build --bundles appimage
      - name: Download aria2 backend
        shell: bash
        env:
          ARIA2_SUFFIX: ${{ matrix.aria2_suffix }}
          ARIA2_BINARY: ${{ matrix.aria2_binary }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/aria2-release.json"
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/FerroDownload/aria2-static-builds/releases/latest" \
            --output "$release_json"
          read -r asset_id checksum_id asset_name checksum_name < <(python3 - "$release_json" "$ARIA2_SUFFIX" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          suffix = sys.argv[2].lower()
          assets = release.get("assets", [])
          selected = None
          for asset in assets:
              name = str(asset.get("name", ""))
              lower = name.lower()
              if lower.startswith("aria2c-") and lower.endswith(suffix) and not lower.endswith(".sha256"):
                  selected = asset
                  break
          if selected is None:
              raise SystemExit(f"aria2 compatible asset not found for suffix: {suffix}")
          checksum_name = f"{selected['name']}.sha256"
          checksum = next((asset for asset in assets if asset.get("name") == checksum_name), None)
          if checksum is None:
              raise SystemExit(f"aria2 checksum asset not found: {checksum_name}")
          print(selected["id"], checksum["id"], selected["name"], checksum_name)
          PY
          )
          mkdir -p dist/aria2-backend
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/FerroDownload/aria2-static-builds/releases/assets/$asset_id" \
            --output "dist/aria2-backend/$ARIA2_BINARY"
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/FerroDownload/aria2-static-builds/releases/assets/$checksum_id" \
            --output "$RUNNER_TEMP/$checksum_name"
          python3 - "dist/aria2-backend/$ARIA2_BINARY" "$RUNNER_TEMP/$checksum_name" "$asset_name" <<'PY'
          import hashlib
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1]).read_bytes()
          checksum_text = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected = checksum_text.split()[0].lower()
          actual = hashlib.sha256(binary).hexdigest()
          if actual != expected:
              raise SystemExit(
                  f"aria2 checksum mismatch for {sys.argv[3]}: expected={expected} actual={actual}"
              )
          print(f"aria2 checksum verified: {actual}")
          PY
          chmod 755 "dist/aria2-backend/$ARIA2_BINARY"

      - name: Stage Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = 'dist/Apocalipse Download Manager'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item 'target/release/apocalipse-desktop.exe' "$package/Apocalipse Download Manager.exe"
          New-Item -ItemType Directory -Force "$package/data/tools/aria2" | Out-Null
          Copy-Item 'dist/aria2-backend/aria2c.exe' "$package/data/tools/aria2/aria2c.exe"
          Copy-Item 'README.md','LICENSE' $package
          Compress-Archive -Path $package -DestinationPath 'dist/${{ matrix.output }}' -Force
      - name: Stage Linux portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package='dist/Apocalipse Download Manager'
          mkdir -p "$package/data/tools/aria2"
          install -m 755 target/release/apocalipse-desktop "$package/apocalipse-download-manager"
          install -m 755 dist/aria2-backend/aria2c "$package/data/tools/aria2/aria2c"
          cp README.md LICENSE "$package/"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          install -m 755 "$appimage" 'dist/apocalipse-download-manager-linux-x64.AppImage'
          tar -C dist -czf 'dist/${{ matrix.output }}' 'Apocalipse Download Manager'
      - name: Stage macOS portable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='dist/Apocalipse Download Manager.app'
          mkdir -p "$app/Contents/MacOS/data/tools/aria2" "$app/Contents/Resources"
          cp target/release/apocalipse-desktop "$app/Contents/MacOS/Apocalipse Download Manager"
          chmod +x "$app/Contents/MacOS/Apocalipse Download Manager"
          install -m 755 dist/aria2-backend/aria2c "$app/Contents/MacOS/data/tools/aria2/aria2c"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp README.md LICENSE "$app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "$app" 'dist/${{ matrix.output }}'
      - name: Record candidate provenance
        shell: bash
        run: |
          git rev-parse HEAD > dist/build-commit.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' >> dist/build-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.output }}
            dist/apocalipse-download-manager-linux-x64.AppImage
            dist/build-commit.txt
          retention-days: 14
          if-no-files-found: error
