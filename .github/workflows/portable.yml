name: Portable builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 portable
            os: windows-latest
            artifact: apocalipse-download-manager-windows-x64-portable
          - name: Linux x64 portable
            os: ubuntu-latest
            artifact: apocalipse-download-manager-linux-x64-portable
          - name: macOS portable
            os: macos-latest
            artifact: apocalipse-download-manager-macos-portable

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build desktop
        run: cargo build --release --locked -p apocalipse-desktop

      - name: Package browser extensions on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content "browser-extension/manifest.json" -Raw | ConvertFrom-Json).version
          $extensionDist = "extension-dist"
          New-Item -ItemType Directory -Force $extensionDist | Out-Null

          Compress-Archive -Path "browser-extension/*" -DestinationPath "$extensionDist/apocalipse-chrome-$version.zip" -Force
          Copy-Item "$extensionDist/apocalipse-chrome-$version.zip" "$extensionDist/apocalipse-edge-$version.zip" -Force

          $signed = "packaging/firefox/apocalipse-firefox-$version.xpi"
          if (Test-Path $signed) {
            Copy-Item $signed "$extensionDist/apocalipse-firefox-$version-signed.xpi" -Force
          } else {
            Copy-Item "browser-extension" "firefox-extension" -Recurse -Force
            @'
          import json
          from pathlib import Path

          path = Path("firefox-extension/manifest.json")
          with path.open(encoding="utf-8") as stream:
              manifest = json.load(stream)

          worker = manifest.pop("background", {}).get("service_worker")
          manifest["background"] = {"scripts": [worker]}
          manifest["browser_specific_settings"] = {
              "gecko": {
                  "id": "apocalipse-download-manager@linuxhell",
                  "strict_min_version": "140.0",
                  "data_collection_permissions": {
                      "required": [
                          "authenticationInfo",
                          "browsingActivity",
                          "websiteContent"
                      ]
                  }
              }
          }

          with path.open("w", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
          '@ | Set-Content -Encoding utf8 package_firefox.py
            python package_firefox.py
            Compress-Archive -Path "firefox-extension/*" -DestinationPath "$extensionDist/apocalipse-firefox-$version-unsigned.xpi" -Force
          }

      - name: Package browser extensions on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('browser-extension/manifest.json'))['version'])")
          extension_dist="extension-dist"
          mkdir -p "$extension_dist"

          (cd browser-extension && zip -qr "../$extension_dist/apocalipse-chrome-${version}.zip" .)
          cp "$extension_dist/apocalipse-chrome-${version}.zip" "$extension_dist/apocalipse-edge-${version}.zip"

          signed="packaging/firefox/apocalipse-firefox-${version}.xpi"
          if [ -f "$signed" ]; then
            cp "$signed" "$extension_dist/apocalipse-firefox-${version}-signed.xpi"
          else
            cp -R browser-extension firefox-extension
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('firefox-extension/manifest.json')
          with path.open(encoding='utf-8') as stream:
              manifest = json.load(stream)

          worker = manifest.pop('background', {}).get('service_worker')
          manifest['background'] = {'scripts': [worker]}
          manifest['browser_specific_settings'] = {
              'gecko': {
                  'id': 'apocalipse-download-manager@linuxhell',
                  'strict_min_version': '140.0',
                  'data_collection_permissions': {
                      'required': [
                          'authenticationInfo',
                          'browsingActivity',
                          'websiteContent'
                      ]
                  }
              }
          }

          with path.open('w', encoding='utf-8') as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
          PY
            (cd firefox-extension && zip -qr "../$extension_dist/apocalipse-firefox-${version}-unsigned.xpi" .)
          fi

      - name: Stage Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/Apocalipse Download Manager"
          New-Item -ItemType Directory -Force "$package/browser extensions" | Out-Null
          Copy-Item "target/release/apocalipse-desktop.exe" "$package/Apocalipse Download Manager.exe"
          Copy-Item "browser-extension" "$package/browser extensions/unpacked-development-extension" -Recurse
          Copy-Item "extension-dist/*" "$package/browser extensions/" -Force
          Copy-Item "README.md","LICENSE" $package
          Compress-Archive -Path $package -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Stage Linux portable package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="dist/Apocalipse Download Manager"
          mkdir -p "$package/browser extensions"
          install -m 755 target/release/apocalipse-desktop "$package/apocalipse-download-manager"
          cp -R browser-extension "$package/browser extensions/unpacked-development-extension"
          cp extension-dist/* "$package/browser extensions/"
          cp README.md LICENSE "$package/"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "Apocalipse Download Manager"

      - name: Stage macOS portable app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/Apocalipse Download Manager.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/browser extensions"
          cp target/release/apocalipse-desktop "$app/Contents/MacOS/Apocalipse Download Manager"
          chmod +x "$app/Contents/MacOS/Apocalipse Download Manager"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp -R browser-extension "$app/Contents/Resources/browser extensions/unpacked-development-extension"
          cp extension-dist/* "$app/Contents/Resources/browser extensions/"
          cp README.md LICENSE "$app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.artifact }}.zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package browser extensions
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('browser-extension/manifest.json'))['version'])")
          (cd browser-extension && zip -qr "../dist/apocalipse-chrome-${version}.zip" .)
          cp "dist/apocalipse-chrome-${version}.zip" "dist/apocalipse-edge-${version}.zip"
          signed="packaging/firefox/apocalipse-firefox-${version}.xpi"
          if [ -f "$signed" ]; then
            cp "$signed" "dist/apocalipse-firefox-${version}-signed.xpi"
          else
            cp -R browser-extension firefox-extension
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('firefox-extension/manifest.json')
          with path.open(encoding='utf-8') as stream:
              manifest = json.load(stream)

          worker = manifest.pop('background', {}).get('service_worker')
          manifest['background'] = {'scripts': [worker]}
          manifest['browser_specific_settings'] = {
              'gecko': {
                  'id': 'apocalipse-download-manager@linuxhell',
                  'strict_min_version': '140.0',
                  'data_collection_permissions': {
                      'required': [
                          'authenticationInfo',
                          'browsingActivity',
                          'websiteContent'
                      ]
                  }
              }
          }

          with path.open('w', encoding='utf-8') as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
          PY
            (cd firefox-extension && zip -qr "../dist/apocalipse-firefox-${version}-unsigned.xpi" .)
          fi
      - name: Create Release and upload portable packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
            tag="v${version}"
          fi
          prerelease=()
          if [[ "$tag" =~ (alpha|beta|rc) ]]; then
            prerelease=(--prerelease)
          fi
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --target "${{ github.sha }}" --generate-notes "${prerelease[@]}"
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              apocalipse-chrome-*|apocalipse-edge-*|apocalipse-firefox-*)
                gh release delete-asset "$tag" "$asset" --yes
                ;;
            esac
          done
          gh release upload "$tag" dist/* --clobber
