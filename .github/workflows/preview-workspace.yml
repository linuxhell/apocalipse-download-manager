name: Preview repair workspace (temporary)
on:
  push:
    branches: [fix/vlc-preview-local-relay]
    paths: [.github/workflows/preview-workspace.yml, .preview.patch]
permissions:
  contents: write
concurrency:
  group: preview-repair-workspace
  cancel-in-progress: false
jobs:
  workspace:
    if: github.repository == 'linuxhell/apocalipse-download-manager' && github.ref == 'refs/heads/fix/vlc-preview-local-relay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply repair on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .preview.patch ]]; then
            git apply --check .preview.patch
            git apply --index .preview.patch
            git rm .preview.patch
            cargo fmt --all
            git add -u
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: authenticated social media preview with isolated local streams'
            git push origin HEAD:refs/heads/fix/vlc-preview-local-relay
          fi
      - name: Export source for offline verification
        shell: bash
        run: |
          mkdir -p /tmp/preview-source
          git archive --format=tar HEAD | gzip > /tmp/preview-source/source.tar.gz
          git rev-parse HEAD > /tmp/preview-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preview-source
          path: /tmp/preview-source/*
          retention-days: 2
          if-no-files-found: error
