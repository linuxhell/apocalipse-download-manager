[package]
name = "apocalipse-transport-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"

# Isolated until interoperability and real multi-interface tests pass.
[workspace]

[features]
default = []
moqt = ["dep:moq-net", "dep:moq-tokio"]

[dependencies]
anyhow = "1"
base64 = "0.22"
noq = { version = "=1.3.0", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
zstd = "0.13"
tempfile = "3"
moq-net = { version = "=0.3.8", optional = true }
moq-tokio = { version = "=0.19.20", default-features = false, features = ["noq", "ring"], optional = true }
