[workspace]
resolver = "2"
members = ["crates/apocalipse-core", "crates/apocalipse-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/linuxhell/apocalipse-download-manager"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
futures-util = "0.3"
hickory-resolver = { version = "0.25", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
uuid = { version = "1.16", features = ["serde", "v4"] }
zeroize = "1.8"
