<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header><strong>APOCALIPSE</strong><span data-i18n="mediaIntelligence"></span></header>
    <section class="pairing">
      <i id="bridge-dot"></i>
      <span id="bridge-label" data-i18n="disconnected">Disconnected</span>
      <input id="pairing-token" type="password" data-i18n-placeholder="pairingToken" placeholder="Pairing token">
      <button id="connect" data-i18n="connect">Connect</button>
    </section>
    <section class="language">
      <select id="language" aria-label="Language">
        <option value="en">English</option>
        <option value="pt_BR">Português (Brasil)</option>
        <option value="zh_CN">简体中文</option>
      </select>
    </section>
    <section class="shortcuts">
      <label><span data-i18n="forceShortcut">Force Apocalipse</span><select id="force-shortcut"><option>Shift</option><option>Alt</option><option value="Control">Ctrl</option></select></label>
      <label><span data-i18n="bypassShortcut">Bypass Apocalipse</span><select id="bypass-shortcut"><option>Alt</option><option>Shift</option><option value="Control">Ctrl</option></select></label>
    </section>
    <nav>
      <button data-kind="video" data-i18n="video" class="active"></button>
      <button data-kind="audio" data-i18n="audio"></button>
      <button data-kind="image" data-i18n="images"></button>
    </nav>
    <section id="requested-media" hidden><img alt=""><div><small data-i18n="requestedMedia"></small><b></b></div></section>
    <section id="bulk-actions"><label><input id="select-all" type="checkbox"><span data-i18n="selectAll"></span></label><button id="download-selected" data-i18n="downloadSelected" disabled></button></section>
    <main id="items"></main>
    <template id="row"><article><input class="media-select" type="checkbox"><span class="preview"><img alt=""><video controls muted playsinline preload="metadata"></video></span><span class="audio-preview" hidden><span class="audio-icon">♫</span><audio controls preload="metadata"></audio></span><div><b></b><small></small></div><button>Download</button></article></template>
    <script src="popup.js"></script>
  </body>
</html>
