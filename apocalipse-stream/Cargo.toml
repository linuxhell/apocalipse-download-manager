[package]
name = "apocalipse-stream"
version = "0.1.0-beta.1"
edition = "2021"
description = "Portable Rust control surface for OBS Studio focused on streaming, recording and overlays"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
obws = "0.15"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
