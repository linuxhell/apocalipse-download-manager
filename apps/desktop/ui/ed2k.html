<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apocalipse ED2K</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="ed2k-window">
    <main class="ed2k-window-main">
      <header class="ed2k-window-header">
        <div>
          <p>APOCALIPSE ED2K</p>
          <h1>Apocalipse ED2K</h1>
        </div>
        <div class="ed2k-connection">
          <span id="ed2k-connection-status" class="ed2k-status-pill" data-state="disconnected" data-i18n="ed2kDisconnected">Disconnected</span>
          <span id="ed2k-id-type" class="ed2k-id-pill" hidden></span>
          <button id="ed2k-connect" type="button" class="primary" data-i18n="ed2kConnect">Connect</button>
          <button id="ed2k-disconnect" type="button" data-i18n="ed2kDisconnect" disabled>Disconnect</button>
        </div>
      </header>

      <nav class="ed2k-tabs">
        <button class="ed2k-tab active" data-ed2k-tab="transfer" data-i18n="ed2kTabTransfer">Transfer</button>
        <button class="ed2k-tab" data-ed2k-tab="servers" data-i18n="ed2kTabServers">Servers</button>
        <button class="ed2k-tab" data-ed2k-tab="search" data-i18n="ed2kTabSearch">Search</button>
      </nav>

      <section id="ed2k-panel-transfer" class="ed2k-panel">
        <div class="ed2k-link-bar">
          <input id="ed2k-link-input" type="text" placeholder="ed2k://|file|...|/" data-i18n-placeholder="ed2kLinkPlaceholder" />
          <button id="ed2k-link-add" type="button" class="primary" data-i18n="ed2kAddLink">Download</button>
        </div>
        <div class="ed2k-transfer-group">
          <header><b data-i18n="ed2kDownloads">Downloads</b></header>
          <div id="ed2k-downloads-list" class="ed2k-list"></div>
          <p id="ed2k-downloads-empty" class="ed2k-empty" data-i18n="ed2kNoDownloads">No ED2K downloads yet.</p>
        </div>
      </section>

      <section id="ed2k-panel-servers" class="ed2k-panel" hidden>
        <div class="ed2k-server-add">
          <input id="ed2k-server-host" type="text" placeholder="server.example.org" data-i18n-placeholder="ed2kServerHost" />
          <input id="ed2k-server-port" type="text" placeholder="4661" />
          <button id="ed2k-server-add" type="button" data-i18n="ed2kAddServer">Add server</button>
        </div>
        <div id="ed2k-server-list" class="ed2k-server-list"></div>
        <p id="ed2k-server-empty" class="ed2k-empty" data-i18n="ed2kNoServers">No servers configured yet.</p>
      </section>

      <section id="ed2k-panel-search" class="ed2k-panel" hidden>
        <form id="ed2k-search-form" class="ed2k-search-form">
          <input id="ed2k-search-keyword" type="text" required data-i18n-placeholder="ed2kSearchPlaceholder" placeholder="Search keyword…" />
          <button class="primary" type="submit" data-i18n="ed2kSearch">Search</button>
        </form>
        <div id="ed2k-search-results" class="ed2k-list"></div>
        <p id="ed2k-search-empty" class="ed2k-empty" data-i18n="ed2kNoResults">No results yet.</p>
      </section>
    </main>
    <script src="ed2k.js"></script>
  </body>
</html>
