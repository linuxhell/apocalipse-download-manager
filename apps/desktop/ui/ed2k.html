<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apocalipse ED2K/Kad</title>
  <link rel="stylesheet" href="classic.css"><link rel="stylesheet" href="ed2k.css">
  <script src="color-mode.js"></script>
</head>
<body class="ed2k-window">
  <header class="ed2k-header"><div><h1>Apocalipse ED2K/Kad</h1></div><span class="ed2k-preview" data-i18n="preview"></span></header>
  <section class="ed2k-toolbar" aria-labelledby="tab-networks">
    <button id="ed2k-connect" class="primary" data-i18n="connect"></button><button id="ed2k-disconnect" data-i18n="disconnect" disabled></button>
    <span class="ed2k-toolbar-divider"></span><button id="ed2k-bootstrap" data-i18n="bootstrap"></button>
    <div class="ed2k-indicators"><span id="ed2k-status"></span><span id="kad-status"></span><span id="incoming-status"></span></div>
  </section>
  <nav class="ed2k-tabs" role="tablist">
    <button role="tab" aria-selected="true" aria-controls="panel-networks" id="tab-networks" data-tab="networks" data-i18n="networks"></button>
    <button role="tab" aria-selected="false" aria-controls="panel-search" id="tab-search" data-tab="search" data-i18n="search"></button>
    <button role="tab" aria-selected="false" aria-controls="panel-transfers" id="tab-transfers" data-tab="transfers" data-i18n="transfers"></button>
    <button role="tab" aria-selected="false" aria-controls="panel-shared" id="tab-shared" data-tab="shared" data-i18n="shared"></button>
    <button role="tab" aria-selected="false" aria-controls="panel-uploads" id="tab-uploads" data-tab="uploads" data-i18n="uploads"></button>
    <button role="tab" aria-selected="false" aria-controls="panel-preferences" id="tab-preferences" data-tab="preferences" data-i18n="preferences"></button>
    <button role="tab" aria-selected="false" aria-controls="panel-log" id="tab-log" data-tab="log" data-i18n="log"></button>
  </nav>
  <main class="ed2k-content">
    <section id="panel-networks" role="tabpanel" aria-labelledby="tab-networks">
      <div class="ed2k-section-heading"><div><h2 data-i18n="servers"></h2><p data-i18n="serversHint"></p></div><span id="server-count" class="ed2k-count"></span></div>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="serverName"></th><th data-i18n="address"></th><th data-i18n="port"></th><th data-i18n="description"></th><th></th></tr></thead><tbody id="ed2k-servers"></tbody></table></div>
      <div class="ed2k-network-bottom"><article><h2>Kad</h2><p id="kad-summary"></p><p data-i18n="kadHint"></p></article><article><h2 data-i18n="scopeTitle"></h2><p data-i18n="scopeHint"></p></article></div>
    </section>
    <section id="panel-search" role="tabpanel" aria-labelledby="tab-search" hidden>
      <div class="ed2k-section-heading"><div><h2 data-i18n="search"></h2><p data-i18n="searchHint"></p></div></div>
      <form id="ed2k-search-form" class="ed2k-search-form"><label><span data-i18n="query"></span><input id="ed2k-query" maxlength="1024" required></label><button id="ed2k-search-submit" class="primary" type="submit" data-i18n="search" disabled></button></form>
      <div class="ed2k-result-tools"><label><span data-i18n="filterResults"></span><input id="ed2k-result-filter" type="search"></label><label><span data-i18n="sortResults"></span><select id="ed2k-result-sort"><option value="sources" data-i18n="sortSources"></option><option value="size" data-i18n="sortSize"></option><option value="name" data-i18n="sortName"></option></select></label></div>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="file"></th><th data-i18n="size"></th><th data-i18n="sources"></th><th>ED2K</th><th></th></tr></thead><tbody id="ed2k-results"></tbody></table></div>
      <p id="search-summary"></p>
      <section id="ed2k-source-panel" hidden><h2 id="ed2k-source-title"></h2><p data-i18n="sourceHint"></p><div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="address"></th><th data-i18n="port"></th><th data-i18n="connectionType"></th></tr></thead><tbody id="ed2k-source-results"></tbody></table></div><p id="ed2k-source-summary"></p></section>
    </section>
    <section id="panel-transfers" role="tabpanel" aria-labelledby="tab-transfers" hidden>
      <div class="ed2k-section-heading"><div><h2 data-i18n="transfers"></h2><p data-i18n="transfersHint"></p></div></div>
      <form id="ed2k-add-form" class="ed2k-search-form"><label><span data-i18n="fileLink"></span><input id="ed2k-file-link" maxlength="4096" required spellcheck="false"></label><button id="ed2k-add-submit" class="primary" type="submit" data-i18n="addDownload"></button></form>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="file"></th><th data-i18n="size"></th><th data-i18n="verifiedProgress"></th><th data-i18n="status"></th><th>Peer</th><th></th></tr></thead><tbody id="ed2k-downloads"></tbody></table></div>
      <p data-i18n="retainedFilesHint"></p>
    </section>
    <section id="panel-shared" role="tabpanel" aria-labelledby="tab-shared" hidden>
      <div class="ed2k-section-heading"><div><h2 data-i18n="shared"></h2><p data-i18n="sharedHint"></p></div><span id="shared-count" class="ed2k-count"></span></div>
      <div class="ed2k-share-tools"><button id="ed2k-share-file" class="primary" data-i18n="shareFile"></button><button id="ed2k-share-folder" class="primary" data-i18n="shareFolder"></button><label class="ed2k-check"><input id="ed2k-share-recursive" type="checkbox" checked><span data-i18n="includeSubfolders"></span></label><button id="ed2k-share-rescan" data-i18n="rescan"></button></div>
      <div id="ed2k-scan" class="ed2k-scan" hidden><progress id="ed2k-scan-bar" max="1" value="0"></progress><span id="ed2k-scan-text"></span></div>
      <p id="ed2k-scan-errors" class="ed2k-warning" hidden></p>
      <h3 data-i18n="sharedItems"></h3>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="sharedPath"></th><th data-i18n="kind"></th><th data-i18n="sharedFiles"></th><th data-i18n="status"></th><th></th></tr></thead><tbody id="ed2k-share-entries"></tbody></table></div>
      <h3 data-i18n="sharedFilesTitle"></h3>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="file"></th><th data-i18n="size"></th><th>ED2K</th><th data-i18n="priority"></th><th data-i18n="requests"></th><th data-i18n="uploaded"></th><th></th></tr></thead><tbody id="ed2k-shared-files"></tbody></table></div>
      <p id="ed2k-publish-status"></p><p data-i18n="removeHint"></p>
    </section>
    <section id="panel-uploads" role="tabpanel" aria-labelledby="tab-uploads" hidden>
      <div class="ed2k-section-heading"><div><h2 data-i18n="uploads"></h2><p data-i18n="uploadsHint"></p></div><span id="upload-total" class="ed2k-count"></span></div>
      <form id="ed2k-upload-form" class="ed2k-search-form"><label><span data-i18n="uploadSlots"></span><input id="ed2k-upload-slots" type="number" min="1" max="64" step="1" required></label><label><span data-i18n="uploadLimit"></span><input id="ed2k-upload-kib" type="number" min="0" max="1000000" step="1" required></label><button id="ed2k-upload-save" class="primary" type="submit" data-i18n="saveSettings"></button></form>
      <h3 data-i18n="activeUploads"></h3>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="client"></th><th data-i18n="address"></th><th data-i18n="file"></th><th data-i18n="uploaded"></th><th data-i18n="elapsed"></th></tr></thead><tbody id="ed2k-upload-active"></tbody></table></div>
      <p id="ed2k-upload-active-summary"></p>
      <h3 data-i18n="waitingQueue"></h3>
      <div class="ed2k-table-wrap"><table><thead><tr><th data-i18n="rank"></th><th data-i18n="client"></th><th data-i18n="address"></th><th data-i18n="file"></th><th data-i18n="waited"></th></tr></thead><tbody id="ed2k-upload-waiting"></tbody></table></div>
      <p id="ed2k-upload-waiting-summary"></p>
    </section>
    <section id="panel-preferences" role="tabpanel" aria-labelledby="tab-preferences" hidden>
      <div class="ed2k-section-heading"><div><h2 data-i18n="preferences"></h2><p data-i18n="preferencesHint"></p></div></div>
      <article class="ed2k-setting"><h3>server.met</h3><label><span data-i18n="listUrl"></span><input id="ed2k-server-url" type="url" value="https://upd.emule-security.org/server.met"></label><div><button id="ed2k-update-servers" data-i18n="updateServers"></button><button id="ed2k-import-servers" data-i18n="importServers"></button></div></article>
      <article class="ed2k-setting"><h3>nodes.dat</h3><label><span data-i18n="listUrl"></span><input id="ed2k-node-url" type="url" value="https://upd.emule-security.org/nodes.dat"></label><div><button id="ed2k-update-nodes" data-i18n="updateNodes"></button><button id="ed2k-import-nodes" data-i18n="importNodes"></button></div></article>
      <p data-i18n="listSafety"></p>
    </section>
    <section id="panel-log" role="tabpanel" aria-labelledby="tab-log" hidden><div class="ed2k-section-heading"><h2 data-i18n="log"></h2><button id="ed2k-clear-log" data-i18n="clear"></button></div><pre id="ed2k-log" role="log"></pre></section>
  </main>
  <footer class="ed2k-footer"><span id="ed2k-feedback" role="status"></span><span data-i18n="engine"></span></footer>
  <script src="ed2k.js"></script>
</body>
</html>
