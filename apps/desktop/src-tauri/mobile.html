<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Apocalipse Mobile</title>
<style>body{margin:0;background:#071014;color:#e8fbff;font:16px system-ui}main{max-width:720px;margin:auto;padding:22px}h1{color:#65eee0}form,article{background:#101b22;border:1px solid #24404a;border-radius:12px;padding:14px;margin:12px 0}input,button{box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #31515b;background:#081218;color:#fff}input{width:100%;margin:6px 0}button{background:#65eee0;color:#071014;font-weight:800}.bar{height:7px;background:#24353b;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#65eee0}small{color:#9cb3ba;word-break:break-all}</style>
<main><h1>👽 Apocalipse Mobile</h1><form id="login"><label>Password / Senha / 密码<input id="password" type="password" required></label><button>Connect / Conectar / 连接</button></form><form id="add" hidden><label>URL<input id="url" type="url" required></label><button>Add download / Adicionar / 添加</button></form><section id="tasks"></section></main>
<script>let token=sessionStorage.apocalipseToken||"";const auth=()=>({Authorization:`Bearer ${token}`});async function refresh(){if(!token)return;const r=await fetch('/v1/mobile/tasks',{headers:auth()});if(!r.ok){token='';login.hidden=false;add.hidden=true;return}login.hidden=true;add.hidden=false;const items=await r.json();tasks.innerHTML=items.map(x=>{const p=x.progress_percent??(x.total?x.received/x.total*100:0);const n=x.destination.split(/[\\/]/).pop();return `<article><b>${escapeHtml(n)}</b><div class=bar><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div><small>${p.toFixed(1)}% · ${escapeHtml(typeof x.state==='string'?x.state:Object.keys(x.state)[0])}</small></article>`}).join('')}function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML}login.onsubmit=e=>{e.preventDefault();token=password.value;sessionStorage.apocalipseToken=token;refresh()};add.onsubmit=async e=>{e.preventDefault();const r=await fetch('/v1/mobile/add',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({url:url.value})});if(r.ok){url.value='';refresh()}};refresh();setInterval(refresh,1500)</script>
