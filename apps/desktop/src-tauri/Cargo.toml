[package]
name = "apocalipse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nibiru-xtreme = { git = "https://github.com/linuxhell/nibiru-xtreme", rev = "5b9c0aca092a2bfd29a2a8763ec9a9bb5968fb39", default-features = false, features = ["upnp"] }
apocalipse-core = { path = "../../../crates/apocalipse-core" }
apocalipse-transport-lab = { path = "../../../experiments/transport-lab", features = ["moqt"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = "0.15"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
uuid.workspace = true
url.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize.workspace = true
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }

tempfile = "3"

[dev-dependencies]
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
